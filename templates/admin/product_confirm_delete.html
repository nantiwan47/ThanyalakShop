{% extends "admin_base.html" %}
{% load static %}

{% block title %}ลบสินค้า{% endblock %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'css/product_confirm_delete.css' %}">
{% endblock %}

{% block content %}
<div class="delete-container">
    <h1>ลบสินค้า</h1>
    <p>คุณแน่ใจหรือไม่ว่าต้องการลบสินค้า <strong>{{ product.name }}</strong> ?</p>

    <div class="delete-buttons">
        <a href="{% url 'product_list' %}" class="btn btn-secondary">ยกเลิก</a>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">ยืนยันการลบ</button>
        </form>
    </div>
</div>
{% endblock %}
